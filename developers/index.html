    <div id="root">
      <noscript>
        <header>
          <h1>Developer Docs — Embed a 360° Panorama or Call the API</h1>
          <p>
            Drop an interactive 360° viewer into any page with a single iframe, or drive the platform from your
            own code: generate equirectangular panoramas, publish them, and read them back as JSON or image
            bytes. No SDK, and no API key for reads.
          </p>
        </header>
        <main>
          <section>
            <h2>Embed a 360° Panorama with One iframe</h2>
            <p>
              Load <code>https://360panoramaviewer.com/?embed=true&amp;pano=https://example.com/my-panorama.jpg#embed</code>
              inside an iframe. The page switches to full-viewport viewer mode, so the frame shows the scene only.
            </p>
            <ul>
              <li><strong>embed=true</strong> — full-viewport viewer mode with a small branding badge.</li>
              <li><strong>pano</strong> — public HTTPS URL of the 2:1 equirectangular image.</li>
              <li><strong>autorotate=1</strong> — slow automatic camera rotation until the visitor drags.</li>
              <li><strong>#embed</strong> — hash form of the embed switch for hosts that strip query strings.</li>
            </ul>
          </section>
          <section>
            <h2>REST API Endpoints</h2>
            <ul>
              <li><strong>GET /api/health</strong> — service, database and payment gateway status.</li>
              <li><strong>GET /api/billing</strong> — public plan configuration and trial credits.</li>
              <li><strong>GET /api/models</strong> — available image models with API keys stripped.</li>
              <li><strong>POST /api/user/guest</strong> — create a trial session and bearer token.</li>
              <li><strong>POST /api/generate</strong> — generate a 2:1 equirectangular panorama from a prompt.</li>
              <li><strong>GET /api/shares?public=1</strong> — listed panoramas only, newest first, no auth.</li>
              <li><strong>GET /api/shares/{id}/image</strong> — panorama bytes, usable as a texture or embed source.</li>
              <li><strong>POST /api/shares</strong> — publish a panorama with a bearer token (PNG or JPEG body).</li>
            </ul>
          </section>
          <section>
            <h2>Authentication and Limits</h2>
            <p>
              Read-only endpoints need no credentials and send <code>Access-Control-Allow-Origin: *</code>.
              Private calls use an <code>Authorization: Bearer</code> session token from the guest or auth
              endpoint. Share reads are rate limited per hour and per day, publishing is limited to a few new
              links per day with a 100 MB personal quota, and generation is limited by daily credits.
            </p>
          </section>
          <section>
            <h2>AI Agents and MCP Tools</h2>
            <p>
              Every endpoint is ordinary JSON over HTTPS, so an agent or a self-hosted MCP server can call
              <code>/api/generate</code> to create a scene and then pass <code>/api/shares/{id}/image</code> to
              other tools as a plain image URL.
            </p>
          </section>
